<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Upadyay</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="page page-auth">
  <div class="role-popup-overlay" id="rolePopupOverlay" onclick="if(event.target===this) closeRolePopup()">
    <div class="role-popup-card">
      <button class="ap-close" style="position:absolute; top:14px; right:14px;" onclick="closeRolePopup()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <h2 style="margin:0 0 6px;" id="rolePopupTitle">Join Upadyay as</h2>
      <p class="sub" style="margin:0 0 22px;" id="rolePopupSub">Choose how you want to use Upadyay</p>
      <div class="role-select" style="display:grid; margin-bottom:0;">
        <div class="role-opt" id="popupRoleSeeker" onclick="pickRoleFromPopup('seeker')">
          <span class="ric"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L1 8.5L12 14L23 8.5L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 11.5V16.5C5 16.5 5 20 12 20C19 20 19 16.5 19 16.5V11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 8.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <div class="rt">Job Seeker</div>
          <div class="rd" id="popupRoleSeekerDesc">Find faculty roles</div>
        </div>
        <div class="role-opt" id="popupRoleCompany" onclick="pickRoleFromPopup('company')">
          <span class="ric"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 21V4.5L12 2L20 4.5V21" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 21V16H15V21" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8H9.01M15 8H15.01M9 12H9.01M15 12H15.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <div class="rt">Company</div>
          <div class="rd" id="popupRoleCompanyDesc">Hire faculty</div>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-page" id="authOverlay">
    <div class="auth-card" id="authCard">
      <button class="ap-close" onclick="closeAuth()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

      <div class="ac-brand"><div class="brand-mark" style="width:26px;height:26px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L1 8.5L12 14L23 8.5L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 11.5V16.5C5 16.5 5 20 12 20C19 20 19 16.5 19 16.5V11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 8.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>Upadyay</div>

      <span class="ap-page-tag" id="apPageTag">Faculty account</span>
      <div id="backToLoginLink" style="display:none; margin-bottom:14px;"></div>
      <h2 id="authTitle">Welcome back</h2>
      <p class="sub" id="authSub">Log in to continue</p>

      <form onsubmit="return submitAuth(event)">
        <div class="modal-field" id="fieldName" style="display:none;">
          <label>Full name</label>
          <input type="text" id="authNameInput" placeholder="Your name">
        </div>
        <div class="modal-field" id="fieldCompanyName" style="display:none;">
          <label>Institution / Company name</label>
          <input type="text" id="authCompanyNameInput" placeholder="e.g. Radha Krishna Junior College">
        </div>
        <div class="modal-field" id="fieldContactPerson" style="display:none;">
          <label>Contact person</label>
          <input type="text" id="authContactPersonInput" placeholder="Your name">
        </div>

        <div class="modal-tabs modal-tabs-icon" id="authMethodTabs" style="margin-bottom:16px;">
          <button type="button" class="modal-tab active" id="methodEmail" onclick="setAuthMethod('email')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5L12 13L21 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>
            <span>Email</span>
          </button>
          <button type="button" class="modal-tab" id="methodPhone" onclick="setAuthMethod('phone')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="2.5" width="10" height="19" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M11 18H13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>Phone</span>
          </button>
        </div>

        <div id="authEmailFields">
          <div class="modal-field">
            <label>Email</label>
            <input type="email" id="authEmailInput" placeholder="you@example.com">
          </div>
          <div class="modal-field">
            <label>Password</label>
            <input type="password" id="authPasswordInput" placeholder="••••••••">
          </div>
          <div class="modal-field" id="fieldConfirmPassword" style="display:none;">
            <label>Confirm password</label>
            <input type="password" id="authConfirmPasswordInput" placeholder="••••••••">
          </div>
        </div>

        <div id="authPhoneFields" style="display:none;">
          <div class="modal-field">
            <label>Mobile number</label>
            <div style="display:flex; gap:8px;">
              <input type="tel" id="authPhoneInput" placeholder="10-digit mobile number" maxlength="10" style="flex:1;">
              <button type="button" class="btn btn-light btn-sm" id="authSendOtpBtn" onclick="sendAuthOtp()" style="white-space:nowrap;">Send OTP</button>
            </div>
          </div>
          <div class="modal-field" id="authOtpField" style="display:none;">
            <label>Enter OTP</label>
            <input type="text" id="authOtpInput" placeholder="6-digit OTP" maxlength="6" inputmode="numeric">
            <span style="font-size:12px; color:var(--ink-faint);">Demo mode — enter any 6-digit code to continue.</span>
          </div>
        </div>

        <p id="authError" style="display:none; font-size:12.5px; color:#B3261E; margin:-6px 0 10px;"></p>
        <button type="submit" class="btn btn-primary" id="authSubmitBtn">Log in</button>
      </form>

      <p class="ac-switch-role" id="acSwitchRole">Not a faculty member? <a href="javascript:void(0)" onclick="openRolePopup(authMode)">Switch account type</a></p>
    </div>
  </div>


  <div id="genericToast" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--blue-900); color:#fff; font-size:13.5px; font-weight:600; padding:11px 20px; border-radius:5px; box-shadow:var(--shadow-lg); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;"></div>

<script src="../js/store.js"></script>
<script src="../js/employer.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/faculty.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/layout.js"></script>
<script>initAuthPage('register');</script>
</body>
</html>
