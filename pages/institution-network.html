<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institution Network — Upadyay</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.nw{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.nw h1{font-size:26px;margin:0 0 6px}.nw h2{font-size:19px;margin:0 0 10px}.nw h3{font-size:15px;margin:0 0 8px}
.nw p.sub{color:var(--ink-faint);margin:0 0 20px;font-size:14px}
.nw-demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--blue-50);border:1px dashed var(--blue-500);border-radius:var(--radius);padding:10px 12px;margin-bottom:22px;font-size:12.5px}
.nw-demo b{margin-right:4px}.nw-demo .btn.on{background:var(--blue-700);color:#fff;border-color:var(--blue-700)}
.c{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pick{cursor:pointer;border:2px solid var(--line);transition:.15s}.pick:hover{border-color:var(--blue-500)}.pick.sel{border-color:var(--blue-700);background:var(--blue-50)}
.lg{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.lg.big{width:64px;height:64px;font-size:22px}
.row{display:flex;gap:12px;align-items:center}.row.top{align-items:flex-start}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.bd{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:20px;display:inline-block}
.bd.m{background:#EFE7FB;color:#5B2AA8}.bd.s{background:#E3EEFF;color:#1B4FBF}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.st.y{background:#FFF4D6;color:#8A6100}.st.g{background:#DDF5E5;color:#17753A}.st.r{background:#FDE3E0;color:#B3261E}.st.n{background:#ECEFF4;color:#55627A}
.mut{color:var(--ink-faint);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.fld.err input{border-color:#B3261E}
.res{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}.res:hover{border-color:var(--blue-500);background:var(--blue-50)}
.sk{height:58px;border-radius:6px;background:linear-gradient(90deg,#eef1f6,#f7f8fb,#eef1f6);background-size:200% 100%;animation:sk 1s infinite}@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--blue-700);border-color:var(--blue-700)}
.num{font-size:26px;font-weight:700;color:var(--blue-900)}
.mod{position:fixed;inset:0;background:rgba(10,20,50,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mod>.c{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.steps{display:flex;flex-direction:column;gap:10px}.steps div{display:flex;gap:10px;align-items:center}.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#ECEFF4;color:#55627A}.dot.d{background:#17753A;color:#fff}.dot.p{background:#F2B01E;color:#fff}
.chk{width:72px;height:72px;border-radius:50%;background:#17753A;color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pop .4s}@keyframes pop{from{transform:scale(.3)}}
.tree{padding-left:18px;border-left:2px solid var(--blue-100);margin-left:22px}
@media(max-width:640px){.mod{align-items:flex-end;padding:0}.mod>.c{border-radius:14px 14px 0 0}.btns .btn{flex:1}}
</style>
</head>
<body class="page">
<div id="siteNav"></div>
<main class="nw" id="app"></main>
<div id="siteChrome"></div>
<script src="../js/store.js"></script>
<script src="../js/employer.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/faculty.js"></script>
<script src="../js/layout.js"></script>
<script>
mountNav(''); mountChrome({noFooter:true});
/* ---------- mock data (UI demo only, no backend) ---------- */
const COL=['#5B2AA8','#1B4FBF','#0E7C66','#B4531A','#A3245E','#3B5B92','#6B7A1F','#7A3E9D'];
const MAINS=[
 {n:'St. Joseph Educational Group',c:'Hyderabad, Telangana',t:'Education Group',code:'10245',d:'Schools, junior colleges and engineering campuses across South India.'},
 {n:'St. Joseph Education Trust',c:'Bengaluru, Karnataka',t:'Education Trust',code:'20871',d:'Charitable trust running 9 institutions.'},
 {n:'St. Jude Institutions',c:'Chennai, Tamil Nadu',t:'University Group',code:'31502',d:'Multi-campus university group.'},
 {n:'Sri Chaitanya Academic Society',c:'Vijayawada, Andhra Pradesh',t:'Education Society',code:'44019',d:'Junior colleges and coaching centres.'},
 {n:'Narayana Vidya Foundation',c:'Nellore, Andhra Pradesh',t:'Foundation',code:'55630',d:'K-12 and professional colleges.'},
 {n:'Osmania Heritage Trust',c:'Hyderabad, Telangana',t:'Education Trust',code:'67744',d:'Heritage degree colleges.'},
 {n:'Stanley Group of Colleges',c:'Hyderabad, Telangana',t:'College Group',code:'78123',d:'Engineering and pharmacy colleges.'}];
const SUB={n:'St. Joseph College of Engineering',c:'Hyderabad, Telangana',t:'Engineering College',by:'Dr. Kittu Kumar',em:'principal@sjce.edu',ph:'+91 98765 43210',d:'AICTE-approved engineering college offering B.Tech and M.Tech programmes.',date:'29 Sep 2026'};
let reqs=[{...SUB,id:1,s:'Pending'},{n:'St. Joseph Polytechnic',c:'Warangal, Telangana',t:'Polytechnic',by:'Ms. Anita Rao',em:'head@sjp.edu',ph:'+91 90000 11111',d:'Diploma programmes in engineering.',date:'27 Sep 2026',id:2,s:'Pending'}];
const BR=[{n:'St. Joseph Junior College',c:'Secunderabad, Telangana',j:11,f:42,a:76,l:'1 day ago'},{n:'St. Joseph Degree College',c:'Karimnagar, Telangana',j:8,f:31,a:54,l:'3 days ago'}];
const S={v:'type',type:null,main:MAINS[0],q:'',role:'reg',tab:'overview',st:'pending',all:false,chk:false,code:''};
const lg=(n,cls='')=>`<div class="lg ${cls}" style="background:${COL[n.length%8]}">${n.split(' ').filter(w=>!/^(St\.|of|and)$/.test(w)).slice(0,2).map(w=>w[0]).join('')}</div>`;
const B=(m)=>m?'<span class="bd m">MAIN BRANCH</span>':'<span class="bd s">SUB-BRANCH</span>';
const ST={pending:['y','🟡 Pending Verification'],approved:['g','🟢 Connected'],rejected:['r','🔴 Request Rejected'],withdrawn:['n','⚪ Request Withdrawn']};
const stB=k=>`<span class="st ${ST[k][0]}">${ST[k][1]}</span>`;
const mainCard=(m,extra='')=>`<div class="c row wrap">${lg(m.n,'big')}<div class="grow"><b>${m.n}</b> ${B(1)}<div class="mut">${m.c} · ${m.t}</div>${extra}</div></div>`;
const go=(v)=>{S.v=v;render();scrollTo(0,0)};
const set=(k,v)=>{S[k]=v;render()};
/* ---------- render ---------- */
function demoBar(){return `<div class="nw-demo"><b>Demo view:</b>
${[['reg','Registration flow'],['sub','Sub-branch dashboard'],['main','Main branch dashboard']].map(([r,l])=>`<button class="btn btn-light btn-sm ${S.role==r?'on':''}" onclick="S.role='${r}';S.tab='overview';if(r=='reg')S.v='type';render()">${l}</button>`).join('')}
${S.role=='sub'?'<span class="mut">Status:</span>'+Object.keys(ST).map(k=>`<button class="btn btn-light btn-sm ${S.st==k?'on':''}" onclick="set('st','${k}')">${k}</button>`).join(''):''}</div>`}
function render(){
  const V={type:vType,code:vFind,confirm:vConfirm,form:vForm,review:vReview,done:vDone}[S.v];
  document.getElementById('app').innerHTML=demoBar()+(S.role=='reg'?V():S.role=='sub'?vSub():vMain());
}
/* 1. choose type */
function vType(){return `<h1>What type of institution are you registering?</h1><p class="sub">Pick one to continue.</p>
<div class="g g2">
<div class="c pick ${S.type=='main'?'sel':''}" onclick="set('type','main')"><div style="font-size:30px">🏛️</div><h2>Main Branch</h2><p class="mut">Create the primary institution profile and manage your branches, colleges, departments, jobs, and requests.</p><span class="btn ${S.type=='main'?'btn-primary':'btn-ghost'} btn-sm">Create Main Branch</span></div>
<div class="c pick ${S.type=='sub'?'sel':''}" onclick="set('type','sub')"><div style="font-size:30px">🏫</div><h2>Sub-Branch / College</h2><p class="mut">Join an existing main institution as a branch, college, campus, or affiliated unit.</p><span class="btn ${S.type=='sub'?'btn-primary':'btn-ghost'} btn-sm">Join Existing Institution</span></div></div>
<p><button class="btn btn-primary" ${S.type?'':'disabled style="opacity:.5"'} onclick="S.type=='main'?goTo('register'):go('code')">Continue</button></p>
${S.type=='main'?'<p class="mut">Main Branch registration continues with the existing institution form (name, logo, cover, type, location, contact, about, social links). Your profile will show a <span class="bd m">MAIN BRANCH</span> label.</p>':''}`}
/* 2. find main institution */
function vFind(){
  const digits=S.code.replace(/\D/g,''),bad=S.code&&!/^\d{5}$/.test(S.code);
  const q=S.q.trim().toLowerCase(),hits=q?MAINS.filter(m=>(m.n+m.c).toLowerCase().includes(q)):[];
  const shown=S.all?hits:hits.slice(0,6);
  return `<h1>Find Your Main Institution</h1><p class="sub">Choose your main institution.</p>
<div class="g g2"><div class="c"><h3>Option A · Main Institution Code</h3>
<label class="fld ${bad?'err':''}">Main Institution Code<input id="code" maxlength="5" inputmode="numeric" placeholder="Enter 5-digit code, e.g. 10245" value="${S.code}" oninput="S.code=this.value;const b=document.getElementById('cb');b.disabled=!/^\\d{5}$/.test(this.value);this.parentNode.classList.toggle('err',this.value&&b.disabled)"></label>
<p class="mut" id="ce">${bad?'Code must be exactly 5 digits.':'Demo codes: 10245, 20871, 31502'}</p>
<button id="cb" class="btn btn-primary btn-sm" ${/^\d{5}$/.test(S.code)?'':'disabled'} onclick="const m=MAINS.find(x=>x.code==S.code);m?(S.main=m,go('confirm')):(S.code='',S.q='zzz',render())">Search Institution</button></div>
<div class="c"><h3>OR · Search by Institution Name</h3>
<label class="fld">Institution name<input id="q" placeholder="Search main institution..." value="${S.q}" oninput="liveQ(this.value)" autofocus></label>
<div id="hits" class="g" style="margin-top:12px">${hitsHtml(q,shown,hits.length)}</div></div></div>`}
function hitsHtml(q,shown,total){
  if(!q)return '<div class="mut">Choose your main institution — start typing to search.</div>';
  if(!shown.length)return `<div class="mut">No matching main institutions found.</div><a class="btn btn-ghost btn-sm" href="#" onclick="S.type='main';go('type');return false">Can't find your institution? Create a Main Branch</a>`;
  return shown.map(m=>`<div class="res" onclick="S.main=MAINS[${MAINS.indexOf(m)}];go('confirm')">${lg(m.n)}<div class="grow"><b>${m.n}</b> ${B(1)}<div class="mut">${m.c} · ${m.t}</div><div class="mut">${m.d}</div></div></div>`).join('')+(total>shown.length?`<button class="btn btn-light btn-sm" onclick="set('all',true)">View all results (${total})</button>`:'');
}
let tm;function liveQ(v){S.q=v;S.all=false;const h=document.getElementById('hits');h.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';clearTimeout(tm);tm=setTimeout(()=>{const q=v.trim().toLowerCase(),hits=q?MAINS.filter(m=>(m.n+m.c).toLowerCase().includes(q)):[];h.innerHTML=hitsHtml(q,hits.slice(0,6),hits.length)},350)}
/* 3. confirm */
function vConfirm(){return `<h1>Selected Main Institution</h1><p class="sub">This sub-branch will be connected to the institution below.</p>
${mainCard(S.main,`<div><b>Institution Code: ${S.main.code}</b></div>`)}
<p class="btns row wrap"><button class="btn btn-primary" onclick="go('form')">Continue</button><button class="btn btn-light" onclick="go('code')">Change Institution</button></p>`}
/* connection card */
const conn=()=>`<div class="c"><div class="mut">Connected Main Branch</div><div class="row wrap" style="margin:8px 0">${lg(S.main.n)}<div class="grow"><b>${S.main.n}</b> ${B(1)}<div class="mut">${S.main.c} · Code <b>${S.main.code}</b></div></div>${stB('pending')}<button class="btn btn-light btn-sm" onclick="go('code')">Change Main Branch</button></div>
<div class="mut">↓</div><div><b>Your Sub-Branch</b> ${B(0)} <span class="mut">Not created yet</span></div></div>`;
/* 4. form */
const F={'Basic Information':['Sub-branch / College name','Institution type|Engineering College,Degree College,Junior College,School,Polytechnic','Department / category','Established year','Logo / profile image|file','Cover image|file','About the branch|area'],
'Location':['Address','City','State','Country','PIN / ZIP code','Map / location link'],
'Contact':['Official email','Phone','Alternate phone','Website','Contact person'],
'Academic Information':['College type|Autonomous,Affiliated,Deemed,Private','University affiliation','Courses / programs','Departments','Specializations','Student capacity','Faculty count','Accreditation (NAAC/NBA)','Recognition (AICTE/UGC)','Facilities'],
'Social / Online Presence':['LinkedIn','Instagram','Facebook','YouTube','Other links']};
function vForm(){return `<h1>Create Your Sub-Branch Profile</h1><p class="sub">You are joining <b>${S.main.n}</b> as a sub-branch. Complete your institution details below. Your profile will be sent to the Main Branch for verification.</p>${conn()}
${Object.entries(F).map(([s,fs])=>`<div class="c" style="margin-top:14px"><h2>${s}</h2><div class="g g3">${fs.map(f=>{const[l,o]=f.split('|');return `<label class="fld">${l}${o=='area'?'<textarea rows="3"></textarea>':o=='file'?'<input type="file">':o?`<select><option>Select</option>${o.split(',').map(x=>`<option>${x}</option>`).join('')}</select>`:'<input>'}</label>`}).join('')}</div></div>`).join('')}
<p class="btns row wrap"><button class="btn btn-light" onclick="go('confirm')">Back</button><button class="btn btn-primary" onclick="go('review')">Review Profile</button></p>`}
/* 5. review */
function vReview(){return `<h1>Review Your Institution</h1>
<div class="g g2"><div><h3>Main Branch</h3>${mainCard(S.main,`<div>Code: <b>${S.main.code}</b></div>`)}</div>
<div><h3>Sub-Branch</h3><div class="c row wrap">${lg(SUB.n,'big')}<div class="grow"><b>${SUB.n}</b> ${B(0)}<div class="mut">${SUB.c}</div><div class="mut">${SUB.em} · ${SUB.ph}</div><div>${SUB.d}</div><div class="mut">Academic: B.Tech, M.Tech · NAAC A · AICTE</div></div></div></div></div>
<label class="row" style="margin:16px 0"><input type="checkbox" onchange="S.chk=this.checked;document.getElementById('sb').disabled=!this.checked"> I confirm that the information provided is correct.</label>
<p class="btns row wrap"><button class="btn btn-light" onclick="go('form')">Back</button><button id="sb" class="btn btn-primary" disabled onclick="go('done')">Submit for Main Branch Verification</button></p>`}
/* 6. done */
function vDone(){return `<div class="c" style="text-align:center;max-width:560px;margin:0 auto"><div class="chk">✓</div><h1>Profile Submitted Successfully</h1><p>Your sub-branch profile has been created and sent to <b>${S.main.n}</b> for verification.</p>${stB('pending')}<div class="steps" style="text-align:left;margin:20px auto;max-width:300px">${[['d','✓','Profile Created'],['d','✓','Sent to Main Branch'],['p','…','Main Branch Review'],['','4','Approved'],['','5','Institution Connected']].map(([c,i,t])=>`<div><span class="dot ${c}">${i}</span>${t}</div>`).join('')}</div>
<button class="btn btn-primary" onclick="S.role='sub';S.st='pending';render()">Go to Dashboard</button></div>`}
/* sub dashboard */
function vSub(){const k=S.st;return `<div class="c row wrap"><div class="grow row wrap">${lg(SUB.n,'big')}<div><h1 style="margin:0">${SUB.n}</h1>${B(0)} ${k=='approved'?'<div style="margin-top:4px"><b>Part of '+S.main.n+'</b> · <a href="#" onclick="S.role=\'main\';render();return false">Main Branch Profile</a></div>':''}<div class="mut">${SUB.c}</div></div></div>${stB(k)}</div>
<h2 style="margin-top:18px">Connected Main Branch</h2>${mainCard(S.main,stB(k))}
${k=='pending'?'<p class="mut">Your request is awaiting Main Branch review. <button class="btn btn-light btn-sm" onclick="set(\'st\',\'withdrawn\')">Withdraw request</button></p>':''}
${k=='rejected'?'<div class="c" style="margin-top:14px;border-color:#B3261E"><b>Rejection reason:</b> Affiliation documents are incomplete. Please re-apply with valid proof.<p><button class="btn btn-primary btn-sm" onclick="S.role=\'reg\';S.v=\'code\';render()">Choose Another Main Branch</button></p></div>':''}
${k=='withdrawn'?'<div class="c" style="margin-top:14px"><b>Request withdrawn.</b> You can send a new request any time.<p><button class="btn btn-primary btn-sm" onclick="S.role=\'reg\';S.v=\'code\';render()">Choose Main Branch</button></p></div>':''}
${k=='approved'?'<h2 style="margin-top:18px">Institution Hierarchy</h2>'+tree():''}
<div class="mut" style="margin-top:18px">Menu: Institution Profile · Main Branch · Jobs · Faculty · Applications · Documents · Verification · Settings</div>`}
const tree=()=>`<div class="c"><div class="row">${lg(S.main.n)}<div><b>${S.main.n}</b> ${B(1)}</div></div><div class="tree"><div class="row" style="margin:12px 0">${lg(SUB.n)}<div><b>${SUB.n}</b> ${B(0)}</div></div><div class="tree mut">Computer Science · Mechanical · Electronics · Civil</div></div></div>`;
/* main dashboard */
const TABS=['overview','branches','requests','jobs','faculty','activity'];
function vMain(){
  const pend=reqs.filter(r=>r.s=='Pending').length,conn=BR.length+reqs.filter(r=>r.s=='Approved').length;
  const body={overview:()=>`<h2>Institution Network</h2><div class="g g3">${[['Main Branch',1],['Connected Branches',conn],['Pending Requests',pend],['Total Faculty','850'],['Active Jobs','126'],['Applications','2,430']].map(([l,n])=>`<div class="c"><div class="num">${n}</div><div class="mut">${l}</div></div>`).join('')}</div><h2 style="margin-top:20px">Branch Hierarchy</h2>${tree()}`,
  branches:()=>`<h2>Connected Institutions</h2><div class="g g2">${[...BR,...reqs.filter(r=>r.s=='Approved').map(r=>({n:r.n,c:r.c,j:24,f:86,a:142,l:'Just now'}))].map(b=>`<div class="c"><div class="row wrap">${lg(b.n)}<div class="grow"><b>${b.n}</b> ${B(0)}<div class="mut">${b.c}</div></div><span class="st g">🟢 Connected</span></div><p class="mut">Jobs: <b>${b.j}</b> · Faculty: <b>${b.f}</b> · Applications: <b>${b.a}</b> · Last activity ${b.l}</p><button class="btn btn-light btn-sm">View Institution</button></div>`).join('')}</div>`,
  requests:()=>`<h2>Sub-Branch Requests</h2><div class="g">${reqs.map(r=>`<div class="c"><div class="row wrap">${lg(r.n)}<div class="grow"><b>${r.n}</b> <span class="bd s">SUB-BRANCH REQUEST</span><div class="mut">${r.c} · ${r.t} · Submitted ${r.date}</div><div class="mut">${r.by} · ${r.em}</div><div>${r.d}</div></div><span class="st ${r.s=='Pending'?'y':r.s=='Approved'?'g':'r'}">${r.s=='Pending'?'🟡 Pending Review':r.s=='Approved'?'🟢 Sub-Branch Approved':'🔴 Rejected'}</span></div>
  <p class="btns row wrap" style="margin:12px 0 0"><button class="btn btn-light btn-sm" onclick="detail(${r.id})">View Profile</button>${r.s=='Pending'?`<button class="btn btn-primary btn-sm" onclick="dlg('a',${r.id})">Approve</button><button class="btn btn-ghost btn-sm" onclick="dlg('r',${r.id})">Reject</button>`:''}</p></div>`).join('')}</div>`,
  jobs:()=>`<h2>Jobs across branches</h2>${filters(['All branches','Job type','Department','Status','Date'])}<div class="g g2">${[['Assistant Professor - CSE',BR[0].n,18],['Lecturer - Mathematics',BR[1].n,9],['Associate Professor - ECE',SUB.n,12]].map(([t,b,a])=>`<div class="c"><b>${t}</b><div class="mut">Posted by:</div><div><b>${b}</b> ${B(0)}</div><div class="mut">Hyderabad, Telangana · Applications: ${a}</div><span class="st g">Active</span></div>`).join('')}</div>`,
  faculty:()=>`<h2>Faculty Across Branches</h2>${filters(['Branch','Department','Subject','Experience','Verification'])}<div class="g g3">${[['Dr. Ravi Teja','Professor','Physics',BR[0].n,'12 yrs','Verified'],['Ms. Sunita Rao','Asst. Professor','Computer Science',BR[1].n,'6 yrs','Verified'],['Mr. Imran Khan','Lecturer','Mathematics',BR[0].n,'3 yrs','Pending']].map(([n,d,s,b,e,v])=>`<div class="c row top">${lg(n)}<div><b>${n}</b><div class="mut">${d} · ${s}</div><div class="mut">${b} · ${e}</div><span class="st ${v=='Verified'?'g':'y'}">${v}</span></div></div>`).join('')}</div>`,
  activity:()=>`<h2>Branch Activity</h2><div class="g">${[['Posted a new faculty position','Assistant Professor - Computer Science','2 hours ago',BR[0].n],['Faculty profile created','Dr. Ravi Teja','5 hours ago',BR[1].n],['Faculty application received','Lecturer - Mathematics','Yesterday',BR[1].n],['New document uploaded','Affiliation certificate','2 days ago',SUB.n],['Branch profile updated','Contact details','3 days ago',BR[0].n]].map(([a,b,t,n])=>`<div class="c row">${lg(n)}<div class="grow"><b>${n}</b><div>${a}</div><div class="mut">${b}</div></div><span class="mut">${t}</span></div>`).join('')}</div>`}[S.tab]();
  return `<div class="c row wrap">${lg(S.main.n,'big')}<div class="grow"><h1 style="margin:0">${S.main.n}</h1>${B(1)}<div class="mut">${S.main.c}</div><b>${conn} Connected Institutions</b></div><button class="btn btn-primary btn-sm" onclick="set('tab','branches')">View Branches</button></div>
  <div class="tabs">${TABS.map(t=>`<button class="${S.tab==t?'on':''}" onclick="set('tab','${t}')">${t[0].toUpperCase()+t.slice(1)}${t=='requests'&&pend?' ('+pend+')':''}</button>`).join('')}</div>${body}
  <div class="mut" style="margin-top:18px">Menu: Institution Profile · Branches · Branch Requests · Faculty · Jobs · Applications · Activity · Verification · Settings</div>`}
const filters=a=>`<div class="row wrap" style="margin-bottom:14px">${a.map(x=>`<select class="fld" style="padding:8px;border:1px solid var(--line);border-radius:4px"><option>${x}</option></select>`).join('')}</div>`;
/* request detail + modals (mock only) */
let modal='';
const mod=h=>{document.getElementById('siteChrome').insertAdjacentHTML('beforeend',`<div class="mod" id="mod" onclick="if(event.target==this)closeMod()"><div class="c">${h}</div></div>`)};
const closeMod=()=>{const m=document.getElementById('mod');m&&m.remove()};
function detail(id){const r=reqs.find(x=>x.id==id);mod(`<div class="row wrap">${lg(r.n,'big')}<div><h2 style="margin:0">${r.n}</h2>${B(0)}</div></div><p class="mut">Connected Main Branch: <b>${S.main.n}</b></p>
<h3>Basic Information</h3><p class="mut">${r.t} · ${r.c}<br>${r.em} · ${r.ph}<br>${r.d}</p><h3>Academic Information</h3><p class="mut">Courses: B.Tech, M.Tech · Departments: CSE, ME, ECE, Civil · Affiliation: JNTUH · Accreditation: NAAC A · Facilities: Labs, Library, Hostel</p>
<h3>Documents</h3><div class="row wrap">${['Affiliation Certificate','AICTE Approval','Registration Proof'].map(d=>`<div class="c" style="padding:8px 12px">📄 ${d}</div>`).join('')}</div>
<h3 style="margin-top:12px">Request Information</h3><p class="mut">Date: ${r.date} · Status: ${r.s} · Submitted by ${r.by}</p>
<p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Close</button>${r.s=='Pending'?`<button class="btn btn-primary" onclick="closeMod();dlg('a',${id})">Approve Sub-Branch</button><button class="btn btn-ghost" onclick="closeMod();dlg('r',${id})">Reject Request</button>`:''}</p>`)}
function dlg(k,id){const r=reqs.find(x=>x.id==id);
 if(k=='a')mod(`<h2>Approve Sub-Branch?</h2><p>You are about to approve <b>${r.n}</b> and connect it to <b>${S.main.n}</b>.</p><div class="c"><b>${S.main.n}</b> ${B(1)}<div class="mut">↓</div><b>${r.n}</b> ${B(0)}</div><p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Cancel</button><button class="btn btn-primary" onclick="fin(${id},'Approved')">Approve &amp; Connect</button></p>`);
 else mod(`<h2>Reject Sub-Branch Request</h2><label class="fld">Reason for rejection<textarea rows="4" placeholder="Please provide a reason for rejecting this request."></textarea></label><p class="btns row wrap"><button class="btn btn-light" onclick="closeMod()">Cancel</button><button class="btn btn-primary" onclick="fin(${id},'Rejected')">Reject Request</button></p>`)}
function fin(id,s){reqs.find(x=>x.id==id).s=s;closeMod();if(id==1)S.st=s=='Approved'?'approved':'rejected';render();mod(`<div style="text-align:center"><div class="chk" style="${s=='Rejected'?'background:#B3261E':''}">${s=='Approved'?'✓':'✕'}</div><h2>${s=='Approved'?'🟢 Sub-Branch Approved':'Request Rejected'}</h2><button class="btn btn-primary" onclick="closeMod();set('tab','${s=='Approved'?'branches':'requests'}')">${s=='Approved'?'View Connected Institutions':'Back to Requests'}</button></div>`)}
render();
</script>
</body>
</html>
